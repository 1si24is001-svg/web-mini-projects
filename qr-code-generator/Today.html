<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Today.js"></script>
</head>
<body>
    <script>
        class Thala{
            constructor(name,role){
                this.name = name;
                this.role= role;
            }
            hitting(){
                document.write(`The name is ${this.name}, he is ${this.role} <br>`)
            }
        }
        let batsman = new Thala('Finisher','Thala');
        batsman.hitting();
        let batsman1 = new Thala('Captain','GOAT');
        batsman1.hitting();
    </script>
</body>
</html>
